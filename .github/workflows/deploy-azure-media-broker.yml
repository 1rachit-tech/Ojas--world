name: Deploy Azure Media Broker

on:
  push:
    branches: [main]
    paths:
      - 'azure_media_broker/**'
      - '.github/workflows/deploy-azure-media-broker.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-media-broker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate broker source
        run: |
          set -euo pipefail
          python -m py_compile azure_media_broker/function_app.py
          test -f azure_media_broker/requirements.txt
          test -f azure_media_broker/host.json
          test -f azure_media_broker/function_app.py
          ! grep -q "timer_trigger" azure_media_broker/function_app.py

      - name: Login to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: 31e8b31a-02e0-49b3-85ca-a6b9ea27cc6a
          tenant-id: 0d1e31fd-6b7e-432a-b12b-bdbbb3ce1159
          subscription-id: 6d21da10-c262-4f29-993b-dffc04e34d43

      - name: Inspect and enforce Flex runtime and scale policy
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ secrets.AZURE_MEDIA_FUNCTION_APP_NAME }}
        run: |
          set -euo pipefail
          test -n "$FUNCTION_APP_NAME"
          APP_ID="$(az resource list --name "$FUNCTION_APP_NAME" --resource-type Microsoft.Web/sites --query '[0].id' -o tsv)"
          test -n "$APP_ID"

          RUNTIME_NAME="$(az resource show --ids "$APP_ID" --query 'properties.functionAppConfig.runtime.name' -o tsv)"
          RUNTIME_VERSION="$(az resource show --ids "$APP_ID" --query 'properties.functionAppConfig.runtime.version' -o tsv)"
          echo "Detected Flex runtime: ${RUNTIME_NAME:-<empty>} ${RUNTIME_VERSION:-<empty>}"

          if [ "$RUNTIME_NAME" != "python" ] || [ "$RUNTIME_VERSION" != "3.11" ]; then
            az resource update --ids "$APP_ID" \
              --set properties.functionAppConfig.runtime.name=python \
                    properties.functionAppConfig.runtime.version=3.11 >/dev/null
          fi

          az resource update --ids "$APP_ID" \
            --set properties.functionAppConfig.scaleAndConcurrency.instanceMemoryMB=512 \
                  properties.functionAppConfig.scaleAndConcurrency.maximumInstanceCount=5 \
                  properties.functionAppConfig.scaleAndConcurrency.alwaysReady=[] >/dev/null

          echo "Final Flex runtime:"
          az resource show --ids "$APP_ID" --query 'properties.functionAppConfig.runtime' -o json
          echo "Final Flex scale policy:"
          az resource show --ids "$APP_ID" --query 'properties.functionAppConfig.scaleAndConcurrency' -o json

      - name: Configure Firebase Admin credential from GitHub secret
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ secrets.AZURE_MEDIA_FUNCTION_APP_NAME }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FUNCTION_APP_NAME"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("project_id"); assert data.get("private_key"); assert data.get("client_email"); print("Firebase service-account JSON shape verified for project:", data["project_id"])'
          az functionapp config appsettings set \
            --resource-group ojas-rg \
            --name "$FUNCTION_APP_NAME" \
            --settings "FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT_JSON" >/dev/null

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/ojas-media-broker.zip
          (
            cd azure_media_broker
            find . -type d -name '__pycache__' -prune -exec rm -rf {} +
            zip -r -q /tmp/ojas-media-broker.zip .
          )
          unzip -l /tmp/ojas-media-broker.zip
          unzip -p /tmp/ojas-media-broker.zip host.json >/dev/null
          unzip -p /tmp/ojas-media-broker.zip function_app.py >/dev/null

      - name: Deploy broker with Azure CLI OneDeploy
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ secrets.AZURE_MEDIA_FUNCTION_APP_NAME }}
        run: |
          set -euo pipefail
          az functionapp deployment source config-zip \
            --resource-group ojas-rg \
            --name "$FUNCTION_APP_NAME" \
            --src /tmp/ojas-media-broker.zip \
            --build-remote true

      - name: Verify live broker health and cost policy
        shell: bash
        env:
          FUNCTION_APP_NAME: ${{ secrets.AZURE_MEDIA_FUNCTION_APP_NAME }}
        run: |
          set -euo pipefail
          HOST="$(az functionapp show --resource-group ojas-rg --name "$FUNCTION_APP_NAME" --query defaultHostName -o tsv)"
          test -n "$HOST"
          HTTP_CODE="$(curl --silent --show-error --max-time 30 -o /tmp/ojas-media-health.json -w '%{http_code}' "https://$HOST/api/health")"
          echo "Azure broker health HTTP status: $HTTP_CODE"
          cat /tmp/ojas-media-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/ojas-media-health.json').read_text())
          required = {
              'ready': True,
              'firebaseAdminReady': True,
              'storageConfigured': True,
              'containerConfigured': True,
              'idleNotificationPolling': False,
              'mode': 'usage-driven',
              'maxUploadBytes': 10 * 1024 * 1024,
          }
          for key, expected in required.items():
              actual = data.get(key)
              if actual != expected:
                  raise SystemExit(f'Health policy mismatch for {key}: {actual!r} != {expected!r}')
          if HTTP_CODE != '200':
              raise SystemExit(f'Unexpected HTTP status: {HTTP_CODE}')
          print('Live Azure media broker health and cost policy verified.')
          PY

name: Deploy Azure Media Broker

on:
  push:
    branches: [main]
    paths:
      - 'azure_media_broker/**'
      - '.github/workflows/deploy-azure-media-broker.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Validate broker source
        run: |
          python -m py_compile azure_media_broker/function_app.py
          test -f azure_media_broker/requirements.txt

      # Authenticate to Azure using GitHub OIDC and the existing user-assigned managed identity.
      - name: Login to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: 31e8b31a-02e0-49b3-85ca-a6b9ea27cc6a
          tenant-id: 0d1e31fd-6b7e-432a-b12b-bdbbb3ce1159
          subscription-id: 6d21da10-c262-4f29-993b-dffc04e34d43

      # Flex Consumption deployment: remote build is required.
      - name: Deploy broker
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_MEDIA_FUNCTION_APP_NAME }}
          package: azure_media_broker
          sku: flexconsumption
          remote-build: true

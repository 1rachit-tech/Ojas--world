name: Repair You Hub routing

on:
  push:
    paths:
      - '.github/workflows/repair-you-hub-routing.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore You Hub as the You tab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          text = path.read_text(encoding='utf-8')
          old = '                        _buildProfileTab(),'
          new = '                        const YouHubScreen(),'
          if old not in text:
              raise SystemExit('Expected You-tab routing line was not found; refusing to modify the repository.')
          updated = text.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit minimal fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git commit -m 'fix(you): restore You Hub messages and profile navigation'
          git push origin HEAD:main

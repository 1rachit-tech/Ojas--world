name: Run Engagement Step 3

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply patch
        run: |
          python3 scripts/apply_engagement_step3_v3.py
          dart format lib/models/ojs_video.dart lib/services/engagement_service.dart lib/widgets/reel_comments_bottom_sheet.dart lib/widgets/reel_shop_products_bottom_sheet.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          flutter pub get
          flutter analyze lib/models/ojs_video.dart lib/services/engagement_service.dart lib/widgets/reel_comments_bottom_sheet.dart lib/widgets/reel_shop_products_bottom_sheet.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-engagement-step3.yml .github/workflows/run-engagement-step3.yml STEP3_TRIGGER.md STEP3_TRIGGER_2.md scripts/apply_engagement_step3.py scripts/apply_engagement_step3_v2.py scripts/apply_engagement_step3_v3.py 2>/dev/null || true
          git add lib/models/ojs_video.dart lib/services/engagement_service.dart lib/widgets/reel_comments_bottom_sheet.dart lib/widgets/reel_shop_products_bottom_sheet.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git diff --cached --check
          git commit -m 'feat(engagement): add zero-waste interactions and creator commerce'
          git push origin HEAD:main

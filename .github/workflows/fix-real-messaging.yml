name: Verify and fix real messaging

on:
  push:
    paths:
      - .github/workflows/fix-real-messaging.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply guarded fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected block missing; refusing to modify.')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Real first-chat creation: create without reading a missing document.
          replace_once(
              'lib/services/messaging_service.dart',
              '''  Future<String> openConversation(OjasProfile otherUser) async {
    final uid = currentUid;
    if (uid == null) {
      throw const MessagingException('Please sign in again.');
    }
    if (otherUser.uid == uid) {
      throw const MessagingException('You cannot message yourself.');
    }

    final currentProfile = await _getCurrentProfile(uid);
    final conversationId = conversationIdFor(uid, otherUser.uid);
    final reference = conversationReference(conversationId);
    final snapshot = await reference.get();

    if (!snapshot.exists) {
      await reference.set({
        'participants': [uid, otherUser.uid],
        'participantProfiles': {
          uid: _profileMap(currentProfile),
          otherUser.uid: _profileMap(otherUser),
        },
        'lastMessage': '',
        'lastMessageSenderId': '',
        'unreadCounts': {uid: 0, otherUser.uid: 0},
        'lastReadAtBy': {uid: FieldValue.serverTimestamp()},
        'typingBy': {uid: false, otherUser.uid: false},
        'createdAt': FieldValue.serverTimestamp(),
        'lastMessageAt': FieldValue.serverTimestamp(),
      });
    }

    return conversationId;
  }
''',
              '''  Future<String> openConversation(OjasProfile otherUser) async {
    final uid = currentUid;
    if (uid == null) {
      throw const MessagingException('Please sign in again.');
    }
    if (otherUser.uid.isEmpty || otherUser.uid == uid) {
      throw const MessagingException('Invalid OJAS user.');
    }

    final currentProfile = await _getCurrentProfile(uid);
    final conversationId = conversationIdFor(uid, otherUser.uid);
    final reference = conversationReference(conversationId);
    final data = {
      'participants': [uid, otherUser.uid],
      'participantProfiles': {
        uid: _profileMap(currentProfile),
        otherUser.uid: _profileMap(otherUser),
      },
      'lastMessage': '',
      'lastMessageSenderId': '',
      'unreadCounts': {uid: 0, otherUser.uid: 0},
      'lastReadAtBy': {uid: FieldValue.serverTimestamp()},
      'typingBy': {uid: false, otherUser.uid: false},
      'createdAt': FieldValue.serverTimestamp(),
      'lastMessageAt': FieldValue.serverTimestamp(),
    };

    try {
      await reference.create(data);
    } on FirebaseException catch (error) {
      if (error.code != 'already-exists') {
        rethrow;
      }
    }

    return conversationId;
  }
''',
              'real conversation creation',
          )
          replace_once(
              'lib/services/messaging_service.dart',
              '''      return conversations;
    });
  }

  Stream<OjasConversation> watchConversation''',
              '''      return conversations
          .where((conversation) => conversation.lastMessage.trim().isNotEmpty)
          .toList(growable: false);
    });
  }

  Stream<OjasConversation> watchConversation''',
              'empty conversation filter',
          )

          # Compatibility with older conversation documents.
          messages = Path('lib/screens/messages_screen.dart')
          text = messages.read_text(encoding='utf-8')
          if "import '../services/profile_service.dart';\n" not in text:
              anchor = "import '../services/messaging_service.dart';\n"
              if anchor not in text:
                  raise SystemExit('Messages import anchor missing; refusing to modify.')
              text = text.replace(anchor, anchor + "import '../services/profile_service.dart';\n", 1)
          replace_once(
              'lib/screens/messages_screen.dart',
              '''    final profileData =
        conversation.profileFor(otherUid);

    final profile =
        OjasProfile.fromMap(
      profileData,
      uid: otherUid,
    );

    await Navigator.of(context).push(
''',
              '''    final profileData = conversation.profileFor(otherUid);

    OjasProfile profile;
    if (profileData.isEmpty) {
      final fetched = await ProfileService.instance.getProfile(otherUid);
      profile = fetched ??
          OjasProfile.empty(
            uid: otherUid,
            displayName: 'OJAS User',
            photoUrl: 'avatar_1',
          );
    } else {
      profile = OjasProfile.fromMap(
        profileData,
        uid: otherUid,
      );
      if (profile.ojasId.isEmpty) {
        final fetched = await ProfileService.instance.getProfile(otherUid);
        if (fetched != null) {
          profile = fetched;
        }
      }
    }

    await Navigator.of(context).push(
''',
              'old conversation profile fallback',
          )
          replace_once(
              'lib/screens/messages_screen.dart',
              "              'Your messages live here',",
              "              'Find your Mitra',",
              'empty-state title',
          )

          router = Path('lib/screens/notification_chat_router.dart')
          text = router.read_text(encoding='utf-8')
          anchor = "import '../services/notification_service.dart';\n"
          if "import '../services/profile_service.dart';\n" not in text:
              if anchor not in text:
                  raise SystemExit('Notification router import anchor missing; refusing to modify.')
              text = text.replace(anchor, anchor + "import '../services/profile_service.dart';\n", 1)
          replace_once(
              'lib/screens/notification_chat_router.dart',
              '''      final profiles = data['participantProfiles'];
      if (profiles is! Map) {
        throw StateError('Conversation profile data is unavailable.');
      }

      final rawProfile = profiles[widget.openData.senderId];
      if (rawProfile is! Map) {
        throw StateError('The sender profile is unavailable.');
      }

      final profile = OjasProfile.fromMap(
        Map<String, dynamic>.from(rawProfile),
        uid: widget.openData.senderId,
      );
''',
              '''      final profiles = data['participantProfiles'];
      OjasProfile? profile;

      if (profiles is Map) {
        final rawProfile = profiles[widget.openData.senderId];
        if (rawProfile is Map) {
          profile = OjasProfile.fromMap(
            Map<String, dynamic>.from(rawProfile),
            uid: widget.openData.senderId,
          );
        }
      }

      profile ??= await ProfileService.instance.getProfile(
        widget.openData.senderId,
      );

      if (profile == null) {
        throw StateError('The sender profile is unavailable.');
      }
''',
              'notification old conversation fallback',
          )
          router.write_text(text, encoding='utf-8')

          # Remove simulation-only production helper when present.
          notification = Path('lib/services/notification_service.dart')
          text = notification.read_text(encoding='utf-8')
          old_sim = '''  void simulateIncomingNotification({
    required String title,
    required String body,
    required String type,
  }) {
    debugPrint('Simulation only: $title / $body / $type');
  }

'''
          if old_sim in text:
              notification.write_text(text.replace(old_sim, '', 1), encoding='utf-8')

          # Reliable swipe navigation with the same state used by the top tabs.
          replace_once(
              'lib/screens/you_hub_screen.dart',
              '''  final _accountStore = _LocalAccountStore();

  int _selectedTab = 0;
''',
              '''  final _accountStore = _LocalAccountStore();
  late final PageController _pageController;

  int _selectedTab = 0;
''',
              'You controller field',
          )
          replace_once(
              'lib/screens/you_hub_screen.dart',
              '''  @override
  void initState() {
    super.initState();
    _loadAccounts();
  }
''',
              '''  @override
  void initState() {
    super.initState();
    _pageController = PageController(initialPage: 0);
    _loadAccounts();
  }
''',
              'You controller init',
          )
          replace_once(
              'lib/screens/you_hub_screen.dart',
              '''  void _changeTab(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();

    setState(() {
      _selectedTab = index;
    });
  }
''',
              '''  void _changeTab(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();
    setState(() {
      _selectedTab = index;
    });

    if (_pageController.hasClients) {
      _pageController.animateToPage(
        index,
        duration: const Duration(milliseconds: 220),
        curve: Curves.easeOutCubic,
      );
    }
  }

  void _onPageChanged(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();
    setState(() {
      _selectedTab = index;
    });
  }
''',
              'You tab handlers',
          )
          replace_once(
              'lib/screens/you_hub_screen.dart',
              '''  @override
  Widget build(BuildContext context) {
''',
              '''  @override
  void dispose() {
    _pageController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
''',
              'You controller dispose',
          )
          replace_once(
              'lib/screens/you_hub_screen.dart',
              '''                    Expanded(
                      child: GestureDetector(
                        behavior: HitTestBehavior.opaque,
                        onHorizontalDragEnd: (details) {
                          final velocity =
                              details.primaryVelocity ?? 0;
                          if (velocity < -220 &&
                              _selectedTab == 0) {
                            _changeTab(1);
                          } else if (velocity > 220 &&
                              _selectedTab == 1) {
                            _changeTab(0);
                          }
                        },
                        child: IndexedStack(
                          index: _selectedTab,
                          children: [
                            const MessagesScreen(
                              showAppBar: false,
                            ),
                            _ProfilePage(
''',
              '''                    Expanded(
                      child: PageView(
                        controller: _pageController,
                        onPageChanged: _onPageChanged,
                        physics: const PageScrollPhysics(),
                        children: [
                          const MessagesScreen(
                            showAppBar: false,
                          ),
                          _ProfilePage(
''',
              'You PageView',
          )

          print('guarded source fixes applied')

      - name: Verify and build release APK
        run: |
          flutter pub get
          dart format lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/services/notification_service.dart lib/screens/you_hub_screen.dart
          git diff --check
          flutter build apk --release

      - name: Commit application source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/services/notification_service.dart lib/screens/you_hub_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: make real Mitra messaging and You navigation reliable"
          git push origin HEAD:main
# verified-source-repair-trigger-v2

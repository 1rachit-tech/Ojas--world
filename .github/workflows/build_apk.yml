name: Build Android APK

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply guarded real-chat and You-tab fixes
        shell: python
        run: |
          from pathlib import Path

          messaging = Path('lib/services/messaging_service.dart')
          text = messaging.read_text(encoding='utf-8')
          start = text.index('  Future<String> openConversation(OjasProfile otherUser) async {')
          end = text.index('  Future<void> sendTextMessage({', start)
          new_method = '''  Future<String> openConversation(OjasProfile otherUser) async {
    final uid = currentUid;
    if (uid == null) {
      throw const MessagingException('Please sign in again.');
    }
    if (otherUser.uid.isEmpty || otherUser.uid == uid) {
      throw const MessagingException('Invalid OJAS user.');
    }

    final currentProfile = await _getCurrentProfile(uid);
    final conversationId = conversationIdFor(uid, otherUser.uid);
    final reference = conversationReference(conversationId);

    final conversationData = <String, dynamic>{
      'participants': [uid, otherUser.uid],
      'participantProfiles': {
        uid: _profileMap(currentProfile),
        otherUser.uid: _profileMap(otherUser),
      },
      'lastMessage': '',
      'lastMessageSenderId': '',
      'unreadCounts': {uid: 0, otherUser.uid: 0},
      'lastReadAtBy': {uid: FieldValue.serverTimestamp()},
      'typingBy': {uid: false, otherUser.uid: false},
      'createdAt': FieldValue.serverTimestamp(),
      'lastMessageAt': FieldValue.serverTimestamp(),
    };

    try {
      final snapshot = await reference.get();
      if (!snapshot.exists) {
        await reference.set(conversationData);
      }
    } on FirebaseException catch (error) {
      final retryable =
          error.code == 'unavailable' ||
          error.code == 'deadline-exceeded' ||
          error.code == 'aborted';
      if (!retryable) {
        rethrow;
      }

      await Future<void>.delayed(const Duration(milliseconds: 250));
      final retrySnapshot = await reference.get();
      if (!retrySnapshot.exists) {
        await reference.set(conversationData);
      }
    }

    return conversationId;
  }

'''
          messaging.write_text(text[:start] + new_method + text[end:], encoding='utf-8')

          messages = Path('lib/screens/messages_screen.dart')
          text = messages.read_text(encoding='utf-8')
          if "import '../services/profile_service.dart';\n" not in text:
              anchor = "import '../services/messaging_service.dart';\n"
              if anchor not in text:
                  raise SystemExit('MessagesScreen profile-service import anchor missing; refusing to modify.')
              text = text.replace(anchor, anchor + "import '../services/profile_service.dart';\n", 1)
          old_open = '''    final profileData =
        conversation.profileFor(otherUid);

    final profile =
        OjasProfile.fromMap(
      profileData,
      uid: otherUid,
    );

    await Navigator.of(context).push(
'''
          new_open = '''    final profileData =
        conversation.profileFor(otherUid);

    OjasProfile profile;
    if (profileData.isEmpty) {
      final fetchedProfile =
          await ProfileService.instance.getProfile(otherUid);
      profile = fetchedProfile ??
          OjasProfile.empty(
            uid: otherUid,
            displayName: 'OJAS User',
            photoUrl: 'avatar_1',
          );
    } else {
      profile = OjasProfile.fromMap(
        profileData,
        uid: otherUid,
      );
      if (profile.ojasId.isEmpty) {
        final fetchedProfile =
            await ProfileService.instance.getProfile(otherUid);
        if (fetchedProfile != null) {
          profile = fetchedProfile;
        }
      }
    }

    await Navigator.of(context).push(
'''
          if old_open not in text:
              raise SystemExit('Messages conversation profile block missing; refusing to modify.')
          text = text.replace(old_open, new_open, 1)
          old_error = '''  String _errorMessage(
    Object error,
  ) {
    if (error is MessagingException) {
      return error.message;
    }

    return 'Something went wrong. Please try again.';
  }
'''
          new_error = '''  String _errorMessage(
    Object error,
  ) {
    if (error is MessagingException) {
      return error.message;
    }
    if (error is FirebaseException) {
      final message = error.message?.trim();
      if (message != null && message.isNotEmpty) {
        return message;
      }
    }

    return 'Unable to start this conversation right now. Please try again.';
  }
'''

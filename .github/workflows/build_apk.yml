                            _changeTab(0);
                          }
                        },
                        child: IndexedStack(
                          index: _selectedTab,
                          children: [
                            const MessagesScreen(
                              showAppBar: false,
                            ),
                            _ProfilePage(
'''
          new_stack = '''                    Expanded(
                      child: PageView(
                        controller: _pageController,
                        onPageChanged: _onPageChanged,
                        physics: const PageScrollPhysics(),
                        children: [
                          const MessagesScreen(
                            showAppBar: false,
                          ),
                          _ProfilePage(
'''
          if old_stack not in text:
              raise SystemExit('You swipe stack anchor missing; refusing to modify.')
          you.write_text(text.replace(old_stack, new_stack, 1), encoding='utf-8')
      - name: Install dependencies
        run: flutter pub get

      - name: Format and compile production app
        run: |
          dart format lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/screens/you_hub_screen.dart
          git diff --check
          flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OJAS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified source and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/build_apk.yml > .github/workflows/build_apk.yml
          rm -f .github/workflows/finalize-real-mitra-chat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/screens/you_hub_screen.dart .github/workflows/build_apk.yml .github/workflows/finalize-real-mitra-chat.yml
          git commit -m "fix: enable real Mitra messaging and You swipe navigation"
          git push origin HEAD:main

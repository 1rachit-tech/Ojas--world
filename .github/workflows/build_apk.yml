'''
          if old_router not in text:
              raise SystemExit('Notification router profile block missing; refusing to modify.')
          router.write_text(text.replace(old_router, new_router, 1), encoding='utf-8')

          you = Path('lib/screens/you_hub_screen.dart')
          text = you.read_text(encoding='utf-8')
          old_field = '''  final _accountStore = _LocalAccountStore();

  int _selectedTab = 0;
'''
          new_field = '''  final _accountStore = _LocalAccountStore();
  late final PageController _pageController;

  int _selectedTab = 0;
'''
          if old_field not in text:
              raise SystemExit('You controller field anchor missing; refusing to modify.')
          text = text.replace(old_field, new_field, 1)
          old_init = '''  @override

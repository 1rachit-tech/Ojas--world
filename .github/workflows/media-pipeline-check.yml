name: Media Pipeline Check

on:
  pull_request:
    paths:
      - 'azure_media_broker/**'
      - 'azure_media_worker/**'
      - 'functions/**'
      - 'lib/services/**'
      - 'lib/models/reel_model.dart'
      - 'lib/models/home_feed_models.dart'
      - '.github/workflows/media-pipeline-check.yml'
  push:
    branches:
      - feature/creation-pipeline-production
    paths:
      - 'azure_media_broker/**'
      - 'azure_media_worker/**'
      - 'functions/**'
      - 'lib/services/**'
      - 'lib/models/reel_model.dart'
      - 'lib/models/home_feed_models.dart'
      - '.github/workflows/media-pipeline-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Azure Function Python
        run: |
          python -m pip install --upgrade pip
          pip install -r azure_media_broker/requirements.txt
          python -m compileall -q azure_media_broker

      - name: Verify FFmpeg worker Python
        run: |
          pip install -r azure_media_worker/requirements.txt
          python -m compileall -q azure_media_worker
          python -m unittest discover -s azure_media_worker -p 'test_*.py'

      - name: Build FFmpeg worker container
        run: docker build --tag ojas-media-worker:ci azure_media_worker

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build Firebase functions
        working-directory: functions
        run: npm run build

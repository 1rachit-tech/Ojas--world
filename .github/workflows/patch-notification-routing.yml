name: Patch Notification Routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply notification routing changes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'lib/main.dart';
            const result = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            if (Array.isArray(result.data) || !result.data.content) {
              core.setFailed('Unable to read lib/main.dart');
              return;
            }
            const sha = result.data.sha;
            const original = Buffer.from(result.data.content, 'base64').toString('utf8');
            let fixed = original;
            fixed = fixed.replace(
              "import 'services/notification_service.dart';",
              "import 'services/notification_service.dart';\nimport 'screens/notification_chat_router.dart';",
            );
            fixed = fixed.replace(
              "Future<void> main() async {",
              "final GlobalKey<NavigatorState> ojasNavigatorKey = GlobalKey<NavigatorState>();\nString? _lastOpenedMessageId;\n\nFuture<void> _openNotificationChat(NotificationOpenData data) async {\n  if (_lastOpenedMessageId == data.messageId) {\n    return;\n  }\n  _lastOpenedMessageId = data.messageId;\n  final navigator = ojasNavigatorKey.currentState;\n  if (navigator == null) {\n    return;\n  }\n  navigator.push(\n    MaterialPageRoute(\n      builder: (_) => NotificationChatRouter(openData: data),\n    ),\n  );\n}\n\nFuture<void> main() async {",
            );
            fixed = fixed.replace(
              "  runApp(const OjasApp());",
              "  runApp(const OjasApp());\n\n  NotificationService.instance.onNotificationOpened.listen(_openNotificationChat);\n  final pendingOpen = NotificationService.instance.consumePendingOpen();\n  if (pendingOpen != null) {\n    WidgetsBinding.instance.addPostFrameCallback((_) {\n      _openNotificationChat(pendingOpen);\n    });\n  }",
            );
            fixed = fixed.replace(
              "      navigatorKey: ojasNavigatorKey,\n",
              "      navigatorKey: ojasNavigatorKey,\n",
            );
            const materialNeedle = "    return MaterialApp(\n      title: 'OJAS',";
            if (!fixed.includes('navigatorKey: ojasNavigatorKey')) {
              fixed = fixed.replace(
                materialNeedle,
                "    return MaterialApp(\n      navigatorKey: ojasNavigatorKey,\n      title: 'OJAS',",
              );
            }
            if (fixed === original) {
              core.setFailed('No expected replacement was applied.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: 'fix(notifications): open correct chat from FCM tap',
              sha,
              content: Buffer.from(fixed, 'utf8').toString('base64'),
            });

name: OJAS media worker check

on:
  pull_request:
    paths:
      - 'azure_media_worker/**'
      - '.github/workflows/media-worker-check.yml'
  push:
    branches:
      - feature/creation-pipeline-production
    paths:
      - 'azure_media_worker/**'
      - '.github/workflows/media-worker-check.yml'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure_media_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run worker unit tests
        run: python -m unittest -v test_pipeline.py

name: Apply Feed Step 2

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply feed patch
        run: python3 tool/apply_feed_step2.py

      - name: Format and analyze
        run: |
          dart format lib/screens/ojs_feed_screen.dart lib/services/reel_feed_service.dart
          flutter pub get
          flutter analyze lib/screens/ojs_feed_screen.dart lib/services/reel_feed_service.dart

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-feed-step2.yml tool/apply_feed_step2.py
          git add lib/screens/ojs_feed_screen.dart lib/services/reel_feed_service.dart
          git diff --cached --check
          git commit -m 'feat(feed): add five-item Firestore infinite reels feed'
          git push origin HEAD:main

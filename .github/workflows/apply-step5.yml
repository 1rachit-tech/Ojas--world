name: Apply Module C Step 5
on:
  push:
    branches: ["step5-creator-hub"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step5-creator-hub
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply and analyze
        run: |
          python3 scripts/apply_step5.py
          dart format lib/screens/creator_profile_screen.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          flutter pub get
          flutter analyze lib/screens/creator_profile_screen.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git diff --check
      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_step5.py .github/workflows/apply-step5.yml
          git add lib/screens/creator_profile_screen.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git diff --cached --check
          git commit -m 'feat(profile): add creator hub and profile routing'
          git push origin HEAD:step5-creator-hub

name: Apply Module C Step 8 Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ hashFiles('.step8-trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Step 8 and commit production tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feed = Path('lib/screens/ojs_feed_screen.dart')
          video = Path('lib/widgets/ojs_video_page.dart')
          f = feed.read_text()
          v = video.read_text()

          # Session-local seen history + watch-time accumulation.
          f = f.replace(
              "  final bool _dummy = false;\n",
              "  final bool _dummy = false;\n",
          ) if "  final bool _dummy = false;\n" in f else f
          f = f.replace(
              "  final Set<String> _savedVideos = <String>{};\n",
              "  final Set<String> _savedVideos = <String>{};\n  final Set<String> _seenReelIds = <String>{};\n  final Map<String, int> _watchTimeMs = <String, int>{};\n  final Set<String> _completionPending = <String>{};\n  DateTime? _watchStartedAt;\n",
              1,
          )

          # Replace initial/next-page loading with unseen-page accumulation, preserving cursor pagination.
          start = f.index('  Future<void> _loadInitialForYouReels() async {')
          end = f.index('\n  OjsVideo _toOjsVideo', start)
          load_block = r'''  Future<void> _loadInitialForYouReels() async {
    if (_forYouLoading) return;
    setState(() => _forYouLoading = true);
    try {
      final collected = <ReelModel>[];
      DocumentSnapshot<Map<String, dynamic>>? cursor;
      var hasMore = true;
      while (collected.length < 5 && hasMore) {
        final page = await _reelFeedService.fetchPage(cursor: cursor);
        cursor = page.cursor;
        hasMore = page.hasMore;
        for (final reel in page.reels) {
          if (!_seenReelIds.contains(reel.id)) collected.add(reel);
          if (collected.length >= 5) break;
        }
      }
      if (!mounted) return;
      setState(() {
        _forYouReels
          ..clear()
          ..addAll(collected);
        _forYouCursor = cursor;
        _forYouHasMore = hasMore;
        _forYouVisibleIndex = collected.isEmpty
            ? 0
            : (_forYouCurrentIndex < collected.length ? _forYouCurrentIndex : 0);
        _forYouLoading = false;
      });
      _markReelSeen(_forYouVisibleIndex);
      if (_forYouVisibleIndex >= 0 && _forYouVisibleIndex < _forYouReels.length) {
        _watchStartedAt = DateTime.now();
      }
      await _warmForYouReel(_forYouVisibleIndex + 1);
    } catch (error) {
      if (!mounted) return;
      setState(() => _forYouLoading = false);
      debugPrint('OJAS For You feed load failed: $error');
    }
  }

  Future<void> _fetchMoreForYouReels() async {
    if (_forYouLoading || !_forYouHasMore || _forYouReels.isEmpty) return;
    _forYouLoading = true;
    try {
      final newReels = <ReelModel>[];
      var cursor = _forYouCursor;
      var hasMore = _forYouHasMore;
      while (newReels.length < 5 && hasMore) {
        final page = await _reelFeedService.fetchPage(cursor: cursor);
        cursor = page.cursor;
        hasMore = page.hasMore;
        for (final reel in page.reels) {
          if (!_seenReelIds.contains(reel.id) &&
              !_forYouReels.any((existing) => existing.id == reel.id)) {
            newReels.add(reel);
          }
          if (newReels.length >= 5) break;
        }
      }
      if (!mounted) return;
      setState(() {
        _forYouReels.addAll(newReels);
        _forYouCursor = cursor;
        _forYouHasMore = hasMore;
        _forYouLoading = false;
      });
    } catch (error) {
      if (!mounted) return;
      _forYouLoading = false;
      debugPrint('OJAS For You next page failed: $error');
    }
  }
'''
          f = f[:start] + load_block + f[end:]

          # Batch local watch metrics when the visible reel changes or the feed screen is disposed.
          old_dispose = '''  @override
  void dispose() {
    _horizontalFeedController.dispose();
    _forYouController.dispose();
    _followingController.dispose();
    super.dispose();
  }
'''
          new_dispose = '''  @override
  void dispose() {
    _flushWatchMetrics(_forYouVisibleIndex);
    _horizontalFeedController.dispose();
    _forYouController.dispose();
    _followingController.dispose();
    super.dispose();
  }
'''
          if old_dispose in f:
            f = f.replace(old_dispose, new_dispose, 1)

          old_visible = '''  void _setForYouVisibleIndex(int index) {
    if (_forYouVisibleIndex == index || !mounted) return;
    setState(() => _forYouVisibleIndex = index);
  }
'''
          new_visible = '''  void _setForYouVisibleIndex(int index) {
    if (_forYouVisibleIndex == index || !mounted) return;
    if (_forYouVisibleIndex >= 0) {
      _flushWatchMetrics(_forYouVisibleIndex);
    }
    setState(() => _forYouVisibleIndex = index);
    if (index >= 0 && index < _forYouReels.length) {
      _markReelSeen(index);
      _watchStartedAt = DateTime.now();
    } else {
      _watchStartedAt = null;
    }
  }

  void _markReelSeen(int index) {
    if (index < 0 || index >= _forYouReels.length) return;
    _seenReelIds.add(_forYouReels[index].id);
  }

  Future<void> _flushWatchMetrics(int index) async {
    if (index < 0 || index >= _forYouReels.length) return;
    final reelId = _forYouReels[index].id;
    final started = _watchStartedAt;
    _watchStartedAt = null;
    if (started != null) {
      _watchTimeMs[reelId] =
          (_watchTimeMs[reelId] ?? 0) + DateTime.now().difference(started).inMilliseconds;
    }
    final watchMs = _watchTimeMs.remove(reelId) ?? 0;
    final completed = _completionPending.remove(reelId) == true;
    if (watchMs <= 0 && !completed) return;
    await _engagementService.syncWatchMetrics(
      reelId: reelId,
      watchTimeMs: watchMs,
      completionDelta: completed ? 1 : 0,
    );
  }
'''
          if old_visible not in f:
            raise SystemExit('Expected visible-index block not found')
          f = f.replace(old_visible, new_visible, 1)

          # Super View ON/OFF should use light impact; existing gesture detector remains untouched.
          f = f.replace(
              "                            HapticFeedback.selectionClick();\n                            if (_isSuperViewActive) {",
              "                            HapticFeedback.lightImpact();\n                            if (_isSuperViewActive) {",
              1,
          )
          f = f.replace(
              "                HapticFeedback.selectionClick();\n              },\n            ),\n            ListTile(",
              "                HapticFeedback.lightImpact();\n              },\n            ),\n            ListTile(",
              1,
          )

          # Wire completion reporting to both feeds.
          f = f.replace(
              "            isSuperViewActive: _isSuperViewActive,\n            onLike:",
              "            isSuperViewActive: _isSuperViewActive,\n            onCompleted: () => _completionPending.add(video.id),\n            onLike:",
          )
          if f.count('onCompleted: () => _completionPending.add(video.id)') != 2:
            raise SystemExit('Expected completion callback in both video feeds')

          # Caption parser already exists from the prior polish pass; ensure it is the rendered caption.
          if '_buildInteractiveCaption(widget.video.caption)' not in v:
            v = v.replace(
                "                    Text(\n                      widget.video.caption,\n                      maxLines: _isCaptionExpanded ? 8 : 2,\n                      overflow: _isCaptionExpanded\n                          ? TextOverflow.visible\n                          : TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        color: Colors.white,\n                        fontSize: 13,\n                        height: 1.3,\n                        fontWeight: FontWeight.w400,\n                      ),\n                    ),",
                "                    _buildInteractiveCaption(widget.video.caption),",
                1,
            )

          # Add a completion callback + controller listener without restructuring the player.
          v = v.replace(
              "  final VoidCallback? onProfile;\n",
              "  final VoidCallback? onProfile;\n  final VoidCallback? onCompleted;\n",
              1,
          )
          v = v.replace(
              "    this.onProfile,\n",
              "    this.onProfile,\n    this.onCompleted,\n",
              1,
          )
          v = v.replace(
              "  void _flushLocalWatchState() {\n    _watchStartedAt = null;\n  }\n",
              "  void _flushLocalWatchState() {\n    _watchStartedAt = null;\n  }\n\n  void _handlePlaybackProgress() {\n    final value = _controller?.value;\n    if (value == null || !value.isInitialized || value.duration == Duration.zero) return;\n    final completed = value.position >= value.duration && !value.isPlaying;\n    if (completed && !_completionQueued) {\n      _completionQueued = true;\n      widget.onCompleted?.call();\n    }\n  }\n\n  void _attachPlaybackListener(VideoPlayerController controller) {\n    controller.addListener(_handlePlaybackProgress);\n  }\n",
              1,
          )
          v = v.replace(
              "  @override\n  void dispose() {\n    _flushLocalWatchState();\n    _animController.dispose();",
              "  @override\n  void dispose() {\n    _flushLocalWatchState();\n    _controller?.removeListener(_handlePlaybackProgress);\n    _animController.dispose();",
              1,
          )
          v = v.replace(
              "      if (widget.isVisible) {\n        _watchStartedAt = DateTime.now();\n        _loadAndPlay();\n",
              "      if (widget.isVisible) {\n        _watchStartedAt = DateTime.now();\n        _completionQueued = false;\n        _loadAndPlay();\n",
              1,
          )
          v = v.replace(
              "      _controller = ctrl;\n      _isInit = ctrl.value.isInitialized;",
              "      _controller?.removeListener(_handlePlaybackProgress);\n      _controller = ctrl;\n      _attachPlaybackListener(ctrl);\n      _isInit = ctrl.value.isInitialized;",
              1,
          )

          feed.write_text(f)
          video.write_text(v)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git rm .github/workflows/apply-step8.yml .step8-trigger
          git commit -m 'feat: polish feed engagement and zero-waste watch metrics'
          git push origin HEAD:main

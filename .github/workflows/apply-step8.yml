name: Apply Module C Step 8
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ hashFiles('.step8-trigger') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/step8_finalize.py
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git rm scripts/step8_finalize.py .github/workflows/apply-step8.yml .step8-trigger
          git commit -m 'feat: finalize Module C invisible polish and zero-waste metrics'
          git push origin HEAD:main

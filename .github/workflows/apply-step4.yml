name: Apply Module C Step 4
on:
  push:
    branches: ["step4-virality-layer"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4-virality-layer
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply and analyze
        run: |
          python3 scripts/apply_step4.py
          dart format lib/models/reel_model.dart lib/models/ojs_video.dart lib/services/engagement_service.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart lib/widgets/share_bottom_sheet.dart lib/screens/audio_reels_screen.dart
          flutter pub get
          flutter analyze lib/models/reel_model.dart lib/models/ojs_video.dart lib/services/engagement_service.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart lib/widgets/share_bottom_sheet.dart lib/screens/audio_reels_screen.dart
      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_step4.py .github/workflows/apply-step4.yml
          git add lib/models/reel_model.dart lib/models/ojs_video.dart lib/services/engagement_service.dart lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart lib/widgets/share_bottom_sheet.dart lib/screens/audio_reels_screen.dart
          git diff --cached --check
          git commit -m 'feat(virality): add follow graph, audio routing and share options'
          git push origin HEAD:step4-virality-layer

name: Repair You tab

on:
  push:
    paths:
      - .github/workflows/repair-you-tab-flicker.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch You tab safely
        shell: python
        run: |
          from pathlib import Path

          you = Path('lib/screens/you_hub_screen.dart')
          text = you.read_text(encoding='utf-8')

          old_loop = """            if (profile != null &&\n                !_accountsLoading) {\n              WidgetsBinding.instance\n                  .addPostFrameCallback(\n                (_) {\n                  if (mounted) {\n                    _refreshAccounts(profile);\n                  }\n                },\n              );\n            }\n\n"""
          if old_loop not in text:
              raise SystemExit('Expected YouHub rebuild loop was not found; refusing to modify the file.')
          text = text.replace(old_loop, '', 1)

          old_import = "import 'login_screen.dart';\n"
          new_import = "import 'login_screen.dart';\nimport 'messages_screen.dart';\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('Expected YouHub login import was not found; refusing to modify the file.')
              text = text.replace(old_import, new_import, 1)

          old_messages = """                          _MessagesPage(\n                            onCompose: () {\n                              ScaffoldMessenger.of(\n                                context,\n                              ).showSnackBar(\n                                const SnackBar(\n                                  content: Text(\n                                    'Real messaging will be connected in the next messaging phase.',\n                                  ),\n                                  behavior:\n                                      SnackBarBehavior\n                                          .floating,\n                                ),\n                              );\n                            },\n                          ),\n"""
          new_messages = """                          const MessagesScreen(\n                            showAppBar: false,\n                          ),\n"""
          if old_messages not in text:
              raise SystemExit('Expected placeholder Messages page was not found; refusing to modify the file.')
          text = text.replace(old_messages, new_messages, 1)

          start = text.find("class _MessagesPage extends StatelessWidget {")
          if start == -1:
              raise SystemExit('Expected placeholder Messages widget class was not found; refusing to modify the file.')
          end = text.find("class _ProfilePage extends StatelessWidget {", start)
          if end == -1:
              raise SystemExit('Expected Profile widget boundary was not found; refusing to modify the file.')
          text = text[:start] + text[end:]

          you.write_text(text, encoding='utf-8')

          messages = Path('lib/screens/messages_screen.dart')
          m = messages.read_text(encoding='utf-8')

          old_ctor = """class MessagesScreen extends StatefulWidget {\n  const MessagesScreen({super.key});\n\n  @override\n"""
          new_ctor = """class MessagesScreen extends StatefulWidget {\n  const MessagesScreen({\n    super.key,\n    this.showAppBar = true,\n  });\n\n  final bool showAppBar;\n\n  @override\n"""
          if old_ctor not in m:
              raise SystemExit('Expected MessagesScreen constructor was not found; refusing to modify the file.')
          m = m.replace(old_ctor, new_ctor, 1)

          old_build_return = """    return Scaffold(\n      backgroundColor: Colors.white,\n      appBar: AppBar(\n"""
          new_build_return = """    return Scaffold(\n      backgroundColor: Colors.white,\n      appBar: widget.showAppBar\n          ? AppBar(\n"""
          if old_build_return not in m:
              raise SystemExit('Expected MessagesScreen Scaffold was not found; refusing to modify the file.')
          m = m.replace(old_build_return, new_build_return, 1)

          marker = """          const SizedBox(width: 8),\n        ],\n      ),\n      body: StreamBuilder<List<OjasConversation>>(\n"""
          replacement = """          const SizedBox(width: 8),\n        ],\n      )\n          : null,\n      body: Column(\n        children: [\n          if (!widget.showAppBar) _buildEmbeddedHeader(),\n          Expanded(\n            child: StreamBuilder<List<OjasConversation>>(\n"""
          if marker not in m:
              raise SystemExit('Expected MessagesScreen app bar/body boundary was not found; refusing to modify the file.')
          m = m.replace(marker, replacement, 1)

          old_end = """        },\n      ),\n    );\n  }\n\n  Widget _buildEmptyState() {\n"""
          new_end = """            },\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _buildEmbeddedHeader() {\n    return Padding(\n      padding: const EdgeInsets.fromLTRB(18, 14, 10, 4),\n      child: Row(\n        children: [\n          const Expanded(\n            child: Text(\n              'Messages',\n              style: TextStyle(\n                color: Color(0xFF111827),\n                fontSize: 28,\n                fontWeight: FontWeight.w800,\n                letterSpacing: -0.8,\n              ),\n            ),\n          ),\n          IconButton(\n            tooltip: 'New message',\n            onPressed: _startNewMessage,\n            icon: const Icon(\n              Icons.edit_outlined,\n              color: Color(0xFF111827),\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _buildEmptyState() {\n"""
          if old_end not in m:
              raise SystemExit('Expected MessagesScreen build boundary was not found; refusing to modify the file.')
          m = m.replace(old_end, new_end, 1)

          messages.write_text(m, encoding='utf-8')

          # Ensure the temporary repair workflow does not remain in the final tree.
          workflow = Path('.github/workflows/repair-you-tab-flicker.yml')
          workflow.unlink()
      - name: Validate diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- lib/screens/you_hub_screen.dart lib/screens/messages_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/you_hub_screen.dart lib/screens/messages_screen.dart .github/workflows/repair-you-tab-flicker.yml
          git commit -m "fix: stabilize You tab and enable real messages"
          git push origin HEAD:main

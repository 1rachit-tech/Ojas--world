name: Repair real messages and You navigation

on:
  push:
    paths:
      - .github/workflows/repair-real-messages.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded production fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected block not found; refusing to modify.')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          messaging = Path('lib/services/messaging_service.dart')
          text = messaging.read_text(encoding='utf-8')
          start = text.index('  Future<String> openConversation(OjasProfile otherUser) async {')
          end = text.index('  Future<void> sendTextMessage({', start)
          method = '''  Future<String> openConversation(OjasProfile otherUser) async {
    final uid = currentUid;
    if (uid == null) {
      throw const MessagingException('Please sign in again.');
    }
    if (otherUser.uid.isEmpty || otherUser.uid == uid) {
      throw const MessagingException('Invalid OJAS user.');
    }

    final currentProfile = await _getCurrentProfile(uid);
    final conversationId = conversationIdFor(uid, otherUser.uid);
    final reference = conversationReference(conversationId);

    final existing = await _conversations
        .where('participants', arrayContains: uid)
        .get();

    for (final document in existing.docs) {
      if (document.id == conversationId) {
        return conversationId;
      }
    }

    await reference.set({
      'participants': [uid, otherUser.uid],
      'participantProfiles': {
        uid: _profileMap(currentProfile),
        otherUser.uid: _profileMap(otherUser),
      },
      'lastMessage': '',
      'lastMessageSenderId': '',
      'unreadCounts': {uid: 0, otherUser.uid: 0},
      'lastReadAtBy': {uid: FieldValue.serverTimestamp()},
      'typingBy': {uid: false, otherUser.uid: false},
      'createdAt': FieldValue.serverTimestamp(),
      'lastMessageAt': FieldValue.serverTimestamp(),
    });

    return conversationId;
  }

'''
          messaging.write_text(text[:start] + method + text[end:], encoding='utf-8')

          messages = Path('lib/screens/messages_screen.dart')
          text = messages.read_text(encoding='utf-8')
          if "import '../services/profile_service.dart';\n" not in text:
              anchor = "import '../services/messaging_service.dart';\n"
              if anchor not in text:
                  raise SystemExit('Messages profile import anchor missing; refusing to modify.')
              text = text.replace(anchor, anchor + "import '../services/profile_service.dart';\n", 1)

          old_open = '''    final profileData =
        conversation.profileFor(otherUid);

    final profile =
        OjasProfile.fromMap(
      profileData,
      uid: otherUid,
    );

    await Navigator.of(context).push(
'''
          new_open = '''    final profileData =
        conversation.profileFor(otherUid);

    OjasProfile profile;
    if (profileData.isEmpty) {
      final fetchedProfile =
          await ProfileService.instance.getProfile(otherUid);
      profile = fetchedProfile ??
          OjasProfile.empty(
            uid: otherUid,
            displayName: 'OJAS User',
            photoUrl: 'avatar_1',
          );
    } else {
      profile = OjasProfile.fromMap(
        profileData,
        uid: otherUid,
      );
      if (profile.ojasId.isEmpty) {
        final fetchedProfile =
            await ProfileService.instance.getProfile(otherUid);
        if (fetchedProfile != null) {
          profile = fetchedProfile;
        }
      }
    }

    await Navigator.of(context).push(
'''
          if old_open not in text:
              raise SystemExit('Messages profile opening block missing; refusing to modify.')
          text = text.replace(old_open, new_open, 1)

          old_empty = '''            const Text(
              'Your messages live here',
              textAlign: TextAlign.center,
              style: TextStyle(
                fontSize: 21,
                fontWeight: FontWeight.w800,
                color: Color(0xFF111827),
              ),
            ),
'''
          new_empty = '''            const Text(
              'Find your Mitra',
              textAlign: TextAlign.center,
              style: TextStyle(
                fontSize: 21,
                fontWeight: FontWeight.w800,
                color: Color(0xFF111827),
                letterSpacing: -0.25,
              ),
            ),
'''
          if old_empty not in text:
              raise SystemExit('Messages empty title block missing; refusing to modify.')
          text = text.replace(old_empty, new_empty, 1)
          messages.write_text(text, encoding='utf-8')

          router = Path('lib/screens/notification_chat_router.dart')
          text = router.read_text(encoding='utf-8')
          if "import '../services/profile_service.dart';\n" not in text:
              anchor = "import '../services/notification_service.dart';\n"
              if anchor not in text:
                  raise SystemExit('Notification router import anchor missing; refusing to modify.')
              text = text.replace(anchor, anchor + "import '../services/profile_service.dart';\n", 1)
          old_router = '''      final profiles = data['participantProfiles'];
      if (profiles is! Map) {
        throw StateError('Conversation profile data is unavailable.');
      }

      final rawProfile = profiles[widget.openData.senderId];
      if (rawProfile is! Map) {
        throw StateError('The sender profile is unavailable.');
      }

      final profile = OjasProfile.fromMap(
        Map<String, dynamic>.from(rawProfile),
        uid: widget.openData.senderId,
      );
'''
          new_router = '''      final profiles = data['participantProfiles'];
      OjasProfile? profile;

      if (profiles is Map) {
        final rawProfile = profiles[widget.openData.senderId];
        if (rawProfile is Map) {
          profile = OjasProfile.fromMap(
            Map<String, dynamic>.from(rawProfile),
            uid: widget.openData.senderId,
          );
        }
      }

      profile ??= await ProfileService.instance.getProfile(
        widget.openData.senderId,
      );

      if (profile == null) {
        throw StateError('The sender profile is unavailable.');
      }
'''
          if old_router not in text:
              raise SystemExit('Notification router block missing; refusing to modify.')
          router.write_text(text.replace(old_router, new_router, 1), encoding='utf-8')

          notification = Path('lib/services/notification_service.dart')
          text = notification.read_text(encoding='utf-8')
          old_sim = '''  void simulateIncomingNotification({
    required String title,
    required String body,
    required String type,
  }) {
    debugPrint('Simulation only: $title / $body / $type');
  }

'''
          if old_sim in text:
              notification.write_text(text.replace(old_sim, '', 1), encoding='utf-8')

          you = Path('lib/screens/you_hub_screen.dart')
          text = you.read_text(encoding='utf-8')
          replace_once('lib/screens/you_hub_screen.dart',
              '''  final _accountStore = _LocalAccountStore();

  int _selectedTab = 0;
''',
              '''  final _accountStore = _LocalAccountStore();
  late final PageController _pageController;

  int _selectedTab = 0;
''', 'You controller field')
          replace_once('lib/screens/you_hub_screen.dart',
              '''  @override
  void initState() {
    super.initState();
    _loadAccounts();
  }
''',
              '''  @override
  void initState() {
    super.initState();
    _pageController = PageController(initialPage: 0);
    _loadAccounts();
  }
''', 'You initState')
          replace_once('lib/screens/you_hub_screen.dart',
              '''  void _changeTab(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();

    setState(() {
      _selectedTab = index;
    });
  }
''',
              '''  void _changeTab(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();
    setState(() {
      _selectedTab = index;
    });

    if (_pageController.hasClients) {
      _pageController.animateToPage(
        index,
        duration: const Duration(milliseconds: 220),
        curve: Curves.easeOutCubic,
      );
    }
  }

  void _onPageChanged(int index) {
    if (_selectedTab == index) {
      return;
    }

    HapticFeedback.selectionClick();
    setState(() {
      _selectedTab = index;
    });
  }
''', 'You tab handler')
          replace_once('lib/screens/you_hub_screen.dart',
              '''  @override
  Widget build(BuildContext context) {
''',
              '''  @override
  void dispose() {
    _pageController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
''', 'You dispose')
          replace_once('lib/screens/you_hub_screen.dart',
              '''                    Expanded(
                      child: GestureDetector(
                        behavior: HitTestBehavior.opaque,
                        onHorizontalDragEnd: (details) {
                          final velocity =
                              details.primaryVelocity ?? 0;
                          if (velocity < -220 &&
                              _selectedTab == 0) {
                            _changeTab(1);
                          } else if (velocity > 220 &&
                              _selectedTab == 1) {
                            _changeTab(0);
                          }
                        },
                        child: IndexedStack(
                          index: _selectedTab,
                          children: [
                            const MessagesScreen(
                              showAppBar: false,
                            ),
                            _ProfilePage(
''',
              '''                    Expanded(
                      child: PageView(
                        controller: _pageController,
                        onPageChanged: _onPageChanged,
                        physics: const PageScrollPhysics(),
                        children: [
                          const MessagesScreen(
                            showAppBar: false,
                          ),
                          _ProfilePage(
''', 'You PageView')
      - name: Format and build
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compile changed app
        run: |
          flutter pub get
          dart format lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/services/notification_service.dart lib/screens/you_hub_screen.dart
          git diff --check
          flutter build apk --release
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: OJAS-Real-Mitra-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-real-messages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/messaging_service.dart lib/screens/messages_screen.dart lib/screens/notification_chat_router.dart lib/services/notification_service.dart lib/screens/you_hub_screen.dart .github/workflows/repair-real-messages.yml
          git commit -m "fix: enable real Mitra messaging and You swipe navigation"
          git push origin HEAD:main

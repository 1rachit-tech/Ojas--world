name: OJAS Search Azure Deployment

on:
  workflow_dispatch:
    inputs:
      provision_paid_resources:
        description: 'Provision new Azure resources (this can create charges).'
        required: true
        default: false
        type: boolean
      use_existing_search_service:
        description: 'Use an already-created Azure AI Search service instead of provisioning one.'
        required: true
        default: false
        type: boolean
      existing_search_resource_group:
        description: 'Resource group containing the existing Azure AI Search service.'
        required: true
        default: ''
        type: string
      existing_search_service_name:
        description: 'Existing Azure AI Search service name.'
        required: true
        default: ''
        type: string
      deploy_function_code:
        description: 'Deploy the Azure Search Function App code.'
        required: true
        default: false
        type: boolean
      search_service_name:
        description: 'Globally unique Azure AI Search service name.'
        required: true
        default: ''
        type: string
      function_app_name:
        description: 'Globally unique Azure Function App name.'
        required: true
        default: ''
        type: string
      function_plan_name:
        description: 'Azure Flex Consumption plan name.'
        required: true
        default: ''
        type: string
      storage_account_name:
        description: 'Globally unique Azure Storage account name.'
        required: true
        default: ''
        type: string
      service_bus_namespace_name:
        description: 'Service Bus namespace name.'
        required: true
        default: ''
        type: string
      search_sku:
        description: 'Azure AI Search tier. Start with Basic for the lowest dedicated production profile.'
        required: true
        default: basic
        type: choice
        options:
          - basic
          - standard
      reconcile:
        description: 'Enable scheduled Firebase-to-Azure reconciliation.'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Azure Search API
        working-directory: azure/search-api
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Validate Firebase indexing bridge
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file azure/search-infra/main.bicep
            az bicep build --file azure/search-infra/backend.bicep

  deploy:
    needs: validate
    if: ${{ inputs.provision_paid_resources || inputs.deploy_function_code || inputs.use_existing_search_service }}
    runs-on: ubuntu-latest
    environment: azure-search-production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cost safety gate
        shell: bash
        run: |
          if [ "${{ inputs.provision_paid_resources }}" = "true" ]; then
            test "${{ inputs.search_sku }}" = "basic"
            echo "COST GUARD: Azure AI Search is locked to Basic for this starter deployment."
            echo "COST GUARD: replicas=1, partitions=1, Flex max instances=2, Always Ready is not configured."
          fi

      - name: Resolve deployment principal object ID
        id: deployment_identity
        shell: bash
        run: |
          PRINCIPAL_ID="$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id --output tsv)"
          test -n "$PRINCIPAL_ID"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Verify explicit paid deployment switch
        if: ${{ inputs.provision_paid_resources == true }}
        run: |
          echo "Azure resource provisioning was explicitly enabled."
          echo "This action can create billable resources."

      - name: Deploy Azure Search backend infrastructure
        if: ${{ inputs.provision_paid_resources == true }}
        id: backend
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./azure/search-infra/backend.bicep
          parameters: >
            location=${{ secrets.AZURE_LOCATION }}
            deployBackend=true
            storageAccountName=${{ inputs.storage_account_name }}
            functionAppName=${{ inputs.function_app_name }}
            functionAppPlanName=${{ inputs.function_plan_name }}
            serviceBusNamespaceName=${{ inputs.service_bus_namespace_name }}

      - name: Deploy Azure Search
        if: ${{ inputs.provision_paid_resources == true }}
        id: search
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./azure/search-infra/main.bicep
          parameters: >
            location=${{ secrets.AZURE_LOCATION }}
            deploySearchService=true
            searchServiceName=${{ inputs.search_service_name }}
            searchSku=basic
            replicaCount=1
            partitionCount=1
            searchApiPrincipalId=${{ steps.backend.outputs.functionPrincipalId }}
            searchWorkerPrincipalId=${{ steps.backend.outputs.functionPrincipalId }}
            deploymentPrincipalId=${{ steps.deployment_identity.outputs.principal_id }}

      - name: Prepare Function package
        if: ${{ inputs.deploy_function_code == true }}
        working-directory: azure/search-api
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run build
          zip -r ../../ojas-search-api.zip host.json package.json dist node_modules >/dev/null

      - name: Configure Function App settings
        if: ${{ inputs.deploy_function_code == true }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          AZURE_SEARCH_INGEST_SECRET: ${{ secrets.AZURE_SEARCH_INGEST_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_CHECK_APP_ID: 1:1076759095973:android:6eb79eb65332688646bb4c
        shell: bash
        run: |
          FUNCTION_HOST="${{ inputs.function_app_name }}"
          SEARCH_ENDPOINT="$(az search service show --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --name "${{ inputs.search_service_name }}" --query endpoint --output tsv)"
          test -n "$SEARCH_ENDPOINT"
          az functionapp config appsettings set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "$FUNCTION_HOST" \
            --settings \
              AZURE_SEARCH_ENDPOINT="$SEARCH_ENDPOINT" \
              AZURE_SEARCH_INDEX_NAME=ojas-search-v1 \
              AZURE_SEARCH_API_VERSION=2026-04-01 \
              AZURE_SEARCH_AUTH_MODE=managed_identity \
              AZURE_SEARCH_ENABLE_VECTOR=false \
              AZURE_SEARCH_ENABLE_SEMANTIC=false \
              AZURE_SEARCH_EVENT_MODE=servicebus \
              SEARCH_SERVICE_BUS_FQDN="${{ inputs.service_bus_namespace_name }}.servicebus.windows.net" \
              SEARCH_SERVICE_BUS_QUEUE=ojas-search-index-events \
              SEARCH_ANALYTICS_QUEUE=ojas-search-events \
              SEARCH_RECONCILE_ENABLED=${{ inputs.reconcile }} \
              SEARCH_RECONCILE_CRON="0 0 */12 * * *" \
              SEARCH_RECONCILE_BATCH_SIZE=250 \
              SEARCH_RECONCILE_MAX_INDEX_DOCS=10000 \
              FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
              FIREBASE_APP_CHECK_APP_ID="$FIREBASE_APP_CHECK_APP_ID" \
              REQUIRE_APP_CHECK=true \
              FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_JSON" \
              AZURE_SEARCH_INGEST_SECRET="$AZURE_SEARCH_INGEST_SECRET"

      - name: Deploy Function package
        if: ${{ inputs.deploy_function_code == true }}
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ inputs.function_app_name }}" \
            --src ojas-search-api.zip

      - name: Create or update Azure Search index with Entra ID
        if: ${{ inputs.provision_paid_resources == true }}
        env:
          SEARCH_ENDPOINT: ${{ steps.search.outputs.endpoint }}
        shell: bash
        run: |
          SEARCH_TOKEN="$(az account get-access-token --resource https://search.azure.com --query accessToken --output tsv)"
          test -n "$SEARCH_TOKEN"
          curl -fsS -X PUT \
            "${SEARCH_ENDPOINT}/indexes/ojas-search-v1?api-version=2026-04-01" \
            -H "Authorization: Bearer ${SEARCH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @azure/search-infra/index.schema.json

      - name: Create or update index on existing Azure Search service
        if: ${{ inputs.use_existing_search_service == true }}
        shell: bash
        run: |
          SEARCH_ENDPOINT="$(az search service show --resource-group "${{ inputs.existing_search_resource_group }}" --name "${{ inputs.existing_search_service_name }}" --query endpoint --output tsv)"
          test -n "$SEARCH_ENDPOINT"
          SEARCH_TOKEN="$(az account get-access-token --resource https://search.azure.com --query accessToken --output tsv)"
          test -n "$SEARCH_TOKEN"
          curl -fsS -X PUT \
            "${SEARCH_ENDPOINT}/indexes('ojas-search-v1')?api-version=2026-04-01" \
            -H "Authorization: Bearer ${SEARCH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data-binary @azure/search-infra/index.schema.json
          echo "Verified/created ojas-search-v1 on the existing Azure AI Search service."

      - name: Smoke-check deployed Function endpoint
        if: ${{ inputs.deploy_function_code == true }}
        shell: bash
        run: |
          FUNCTION_BASE="https://${{ inputs.function_app_name }}/api"
          echo "Function API base: ${FUNCTION_BASE}"
          echo "Search routes are protected by Firebase Auth + Firebase App Check."
          echo "Endpoint health is validated by authenticated application traffic, not an anonymous probe."

      - name: Deployment summary
        run: |
          echo "OJAS Search security-hardened starter deployment completed."
          echo "Flutter API base: https://${{ inputs.function_app_name }}/api"
          echo "Search SKU: ${{ inputs.search_sku }} | replicas: 1 | partitions: 1"
          echo "Azure Search local API-key authentication: disabled."
          echo "Firebase App Check enforcement: enabled."
          echo "Vector mode remains disabled until a verified embedding/vectorizer deployment is configured."
          echo "Semantic ranking remains disabled initially to control cost."

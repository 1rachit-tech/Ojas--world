name: Deploy Firebase Security Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-rules-deployment
  cancel-in-progress: false

jobs:
  deploy-firebase-rules:
    name: Deploy Firestore and Storage Rules
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Verify Firebase configuration
        run: |
          test -f firebase.json
          test -f firestore.rules
          test -f storage.rules

      - name: Deploy Firebase Security Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only firestore:rules,storage \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

name: Apply Module C Step 7 UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and commit Step 7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          feed = Path('lib/screens/ojs_feed_screen.dart')
          video = Path('lib/widgets/ojs_video_page.dart')
          f = feed.read_text()
          v = video.read_text()

          if '_isSuperViewActive' not in f:
            f = f.replace('  bool _isCommentsOpen = false;\n', '  bool _isCommentsOpen = false;\n  bool _isSuperViewActive = false;\n', 1)

          if "title: const Text('Super View'" not in f:
            start = f.index('  void _showOptionsSheet() {')
            end = f.index('\n  void _toggleLikeVideo', start)
            f = f[:start] + '''  void _showOptionsSheet() {\n    showModalBottomSheet<void>(\n      context: context,\n      backgroundColor: const Color(0xFF13171D),\n      shape: const RoundedRectangleBorder(\n        borderRadius: BorderRadius.vertical(top: Radius.circular(22)),\n      ),\n      builder: (_) => SafeArea(\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            const SizedBox(height: 8),\n            ListTile(\n              leading: const Icon(Icons.visibility_rounded, color: Color(0xFFF5B942)),\n              title: const Text('Super View', style: TextStyle(color: Colors.white, fontWeight: FontWeight.w700)),\n              subtitle: const Text('Maximize the video while keeping commerce visible', style: TextStyle(color: Colors.white54)),\n              onTap: () {\n                Navigator.pop(context);\n                if (!mounted) return;\n                setState(() => _isSuperViewActive = true);\n                HapticFeedback.selectionClick();\n              },\n            ),\n            ListTile(\n              leading: const Icon(Icons.visibility_off_outlined, color: Colors.white70),\n              title: const Text('Not Interested', style: TextStyle(color: Colors.white)),\n              subtitle: const Text('Tune your feed locally', style: TextStyle(color: Colors.white54)),\n              onTap: () {\n                Navigator.pop(context);\n                _markCurrentNotInterested();\n              },\n            ),\n            ListTile(\n              leading: const Icon(Icons.flag_outlined, color: Colors.white70),\n              title: const Text('Report', style: TextStyle(color: Colors.white)),\n              onTap: () {\n                Navigator.pop(context);\n                ScaffoldMessenger.of(context).showSnackBar(\n                  const SnackBar(content: Text('Report submitted for review')),\n                );\n              },\n            ),\n            const SizedBox(height: 8),\n          ],\n        ),\n      ),\n    );\n  }\n''' + f[end:]

          old_menu = '''                      Positioned(\n                        right: 0,\n                        child: IconButton(\n                          onPressed: _showOptionsSheet,\n                          icon: const Icon(\n                            Icons.more_vert_rounded,\n                            color: Colors.white,\n                            size: 24,\n                          ),\n                        ),\n                      ),\n'''
          if old_menu in f:
            f = f.replace(old_menu, '''                      Positioned(\n                        right: 0,\n                        child: IconButton(\n                          tooltip: _isSuperViewActive ? 'Restore UI' : 'More options',\n                          onPressed: () {\n                            HapticFeedback.selectionClick();\n                            if (_isSuperViewActive) {\n                              setState(() => _isSuperViewActive = false);\n                            } else {\n                              _showOptionsSheet();\n                            }\n                          },\n                          icon: Icon(\n                            _isSuperViewActive ? Icons.visibility_rounded : Icons.more_vert_rounded,\n                            color: Colors.white,\n                            size: 24,\n                          ),\n                        ),\n                      ),\n''', 1)

          f = f.replace('          setState(() => _forYouCurrentIndex = index);\n', '          setState(() {\n            _forYouCurrentIndex = index;\n            _isSuperViewActive = false;\n          });\n', 1)
          f = f.replace('      onPageChanged: (index) => setState(() => _followingCurrentIndex = index),\n', '      onPageChanged: (index) => setState(() {\n        _followingCurrentIndex = index;\n        _isSuperViewActive = false;\n      }),\n', 1)
          f = f.replace('              onPageChanged: (index) =>\n                  setState(() => _currentSelectedFeed = index),\n', '              onPageChanged: (index) => setState(() {\n                _currentSelectedFeed = index;\n                _isSuperViewActive = false;\n              }),\n', 1)

          pattern = r'(?m)^(\s*)isSaved: _savedVideos\.contains\(video\.id\),$'
          matches = list(re.finditer(pattern, f))
          if len(matches) != 2:
            raise SystemExit(f'Expected two OjsVideoPage feed wiring points, found {len(matches)}')
          f = re.sub(pattern, lambda m: m.group(0) + '\\n' + m.group(1) + 'isSuperViewActive: _isSuperViewActive,', f)

          if 'final bool isSuperViewActive;' not in v:
            v = v.replace('  final bool isSaved;\n', '  final bool isSaved;\n  final bool isSuperViewActive;\n', 1)
          if 'this.isSuperViewActive = false' not in v:
            v = v.replace('    this.isSaved = false,\n', '    this.isSaved = false,\n    this.isSuperViewActive = false,\n', 1)

          old_rail = '''            if (!_clearDisplay)\n              Positioned(\n                right: 10,\n                bottom: 84 + MediaQuery.of(context).viewPadding.bottom,\n                child: Column(\n'''
          if old_rail in v:
            v = v.replace(old_rail, '''            if (!_clearDisplay)\n              Positioned(\n                right: 10,\n                bottom: 84 + MediaQuery.of(context).viewPadding.bottom,\n                child: IgnorePointer(\n                  ignoring: widget.isSuperViewActive,\n                  child: AnimatedOpacity(\n                    duration: const Duration(milliseconds: 220),\n                    curve: Curves.easeOut,\n                    opacity: widget.isSuperViewActive ? 0.0 : 1.0,\n                    child: Column(\n''', 1)
            rail_end = '''                  ],\n                ),\n              ),\n\n            // 7. Bottom Metadata\n'''
            if rail_end not in v:
              raise SystemExit('Expected action rail end not found')
            v = v.replace(rail_end, '''                    ],\n                  ),\n                ),\n              ),\n\n            // 7. Bottom Metadata\n''', 1)

          if 'opacity: widget.isSuperViewActive ? 0.0 : 1.0' not in v:
            old_caption = '''                    const SizedBox(height: 5),\n                    Text(\n                      widget.video.caption,\n                      maxLines: _isCaptionExpanded ? 8 : 2,\n                      overflow: _isCaptionExpanded\n                          ? TextOverflow.visible\n                          : TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        color: Colors.white,\n                        fontSize: 13,\n                        height: 1.3,\n                        fontWeight: FontWeight.w400,\n                      ),\n                    ),\n                    if (widget.video.caption.length > 90)\n                      GestureDetector(\n                        onTap: () => setState(\n                          () => _isCaptionExpanded = !_isCaptionExpanded,\n                        ),\n                        child: Padding(\n                          padding: const EdgeInsets.only(top: 3),\n                          child: Text(\n                            _isCaptionExpanded ? 'See less' : '...See more',\n                            style: const TextStyle(\n                              color: Colors.white70,\n                              fontSize: 11.5,\n                              fontWeight: FontWeight.w700,\n                            ),\n                          ),\n                        ),\n                      ),\n'''
            new_caption = '''                    AnimatedOpacity(\n                      duration: const Duration(milliseconds: 220),\n                      curve: Curves.easeOut,\n                      opacity: widget.isSuperViewActive ? 0.0 : 1.0,\n                      child: IgnorePointer(\n                        ignoring: widget.isSuperViewActive,\n                        child: Column(\n                          crossAxisAlignment: CrossAxisAlignment.start,\n                          mainAxisSize: MainAxisSize.min,\n                          children: [\n                            const SizedBox(height: 5),\n                            Text(\n                              widget.video.caption,\n                              maxLines: _isCaptionExpanded ? 8 : 2,\n                              overflow: _isCaptionExpanded\n                                  ? TextOverflow.visible\n                                  : TextOverflow.ellipsis,\n                              style: const TextStyle(\n                                color: Colors.white,\n                                fontSize: 13,\n                                height: 1.3,\n                                fontWeight: FontWeight.w400,\n                              ),\n                            ),\n                            if (widget.video.caption.length > 90)\n                              GestureDetector(\n                                onTap: () => setState(\n                                  () => _isCaptionExpanded = !_isCaptionExpanded,\n                                ),\n                                child: Padding(\n                                  padding: const EdgeInsets.only(top: 3),\n                                  child: Text(\n                                    _isCaptionExpanded ? 'See less' : '...See more',\n                                    style: const TextStyle(\n                                      color: Colors.white70,\n                                      fontSize: 11.5,\n                                      fontWeight: FontWeight.w700,\n                                    ),\n                                  ),\n                                ),\n                              ),\n                          ],\n                        ),\n                      ),\n                    ),\n'''
            if old_caption not in v:
              raise SystemExit('Expected caption block not found')
            v = v.replace(old_caption, new_caption, 1)

          feed.write_text(f)
          video.write_text(v)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git rm .github/workflows/apply-step7.yml .step7-trigger
          git commit -m 'feat: add Super View and finalize share sheet wiring'
          git push origin HEAD:main

name: Apply Module C Step 7 UI Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate Step 7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feed = Path('lib/screens/ojs_feed_screen.dart')
          video = Path('lib/widgets/ojs_video_page.dart')

          f = feed.read_text()
          v = video.read_text()

          # Feed-local Super View state.
          f = f.replace(
              "  bool _isCommentsOpen = false;\n",
              "  bool _isCommentsOpen = false;\n  bool _isSuperViewActive = false;\n",
          )

          old_sheet = """  void _showOptionsSheet() {\n    showModalBottomSheet<void>(\n      context: context,\n      backgroundColor: const Color(0xFF13171D),\n      shape: const RoundedRectangleBorder(\n        borderRadius: BorderRadius.vertical(top: Radius.circular(22)),\n      ),\n      builder: (_) => SafeArea(\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            const SizedBox(height: 8),\n            ListTile(\n              leading: const Icon(\n                Icons.visibility_off_outlined,\n                color: Colors.white70,\n              ),\n              title: const Text(\n                'Not Interested',\n                style: TextStyle(color: Colors.white),\n              ),\n              subtitle: const Text(\n                'Tune your feed locally',\n                style: TextStyle(color: Colors.white54),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                _markCurrentNotInterested();\n              },\n            ),\n            ListTile(\n              leading: const Icon(Icons.flag_outlined, color: Colors.white70),\n              title: const Text(\n                'Report',\n                style: TextStyle(color: Colors.white),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                ScaffoldMessenger.of(context).showSnackBar(\n                  const SnackBar(content: Text('Report submitted for review')),\n                );\n              },\n            ),\n            const SizedBox(height: 8),\n          ],\n        ),\n      ),\n    );\n  }\n"""
          new_sheet = """  void _showOptionsSheet() {\n    showModalBottomSheet<void>(\n      context: context,\n      backgroundColor: const Color(0xFF13171D),\n      shape: const RoundedRectangleBorder(\n        borderRadius: BorderRadius.vertical(top: Radius.circular(22)),\n      ),\n      builder: (_) => SafeArea(\n        child: Column(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            const SizedBox(height: 8),\n            ListTile(\n              leading: const Icon(\n                Icons.visibility_rounded,\n                color: Color(0xFFF5B942),\n              ),\n              title: const Text(\n                'Super View',\n                style: TextStyle(\n                  color: Colors.white,\n                  fontWeight: FontWeight.w700,\n                ),\n              ),\n              subtitle: const Text(\n                'Maximize the video while keeping commerce visible',\n                style: TextStyle(color: Colors.white54),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                if (!mounted) return;\n                setState(() => _isSuperViewActive = true);\n                HapticFeedback.selectionClick();\n              },\n            ),\n            ListTile(\n              leading: const Icon(\n                Icons.visibility_off_outlined,\n                color: Colors.white70,\n              ),\n              title: const Text(\n                'Not Interested',\n                style: TextStyle(color: Colors.white),\n              ),\n              subtitle: const Text(\n                'Tune your feed locally',\n                style: TextStyle(color: Colors.white54),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                _markCurrentNotInterested();\n              },\n            ),\n            ListTile(\n              leading: const Icon(Icons.flag_outlined, color: Colors.white70),\n              title: const Text(\n                'Report',\n                style: TextStyle(color: Colors.white),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                ScaffoldMessenger.of(context).showSnackBar(\n                  const SnackBar(content: Text('Report submitted for review')),\n                );\n              },\n            ),\n            const SizedBox(height: 8),\n          ],\n        ),\n      ),\n    );\n  }\n"""
          if old_sheet not in f:
              raise SystemExit('Expected options sheet block not found')
          f = f.replace(old_sheet, new_sheet, 1)

          # Reset Super View when changing feed/video so the mode belongs to the visible reel.
          f = f.replace(
              "onPageChanged: (index) => setState(() => _currentSelectedFeed = index),",
              "onPageChanged: (index) => setState(() {\n                _currentSelectedFeed = index;\n                _isSuperViewActive = false;\n              }),",
          )
          f = f.replace(
              "          setState(() => _forYouCurrentIndex = index);\n          if (_forYouReels.isNotEmpty && index >= _forYouReels.length - 2) {",
              "          setState(() {\n            _forYouCurrentIndex = index;\n            _isSuperViewActive = false;\n          });\n          if (_forYouReels.isNotEmpty && index >= _forYouReels.length - 2) {",
          )
          f = f.replace(
              "onPageChanged: (index) => setState(() => _followingCurrentIndex = index),",
              "onPageChanged: (index) => setState(() {\n        _followingCurrentIndex = index;\n        _isSuperViewActive = false;\n      }),",
          )

          # Top-right control becomes an Eye/Unlock-style restore control in Super View.
          old_icon = """                      Positioned(\n                        right: 0,\n                        child: IconButton(\n                          onPressed: _showOptionsSheet,\n                          icon: const Icon(\n                            Icons.more_vert_rounded,\n                            color: Colors.white,\n                            size: 24,\n                          ),\n                        ),\n                      ),\n"""
          new_icon = """                      Positioned(\n                        right: 0,\n                        child: IconButton(\n                          tooltip: _isSuperViewActive ? 'Restore UI' : 'More options',\n                          onPressed: () {\n                            HapticFeedback.selectionClick();\n                            if (_isSuperViewActive) {\n                              setState(() => _isSuperViewActive = false);\n                            } else {\n                              _showOptionsSheet();\n                            }\n                          },\n                          icon: Icon(\n                            _isSuperViewActive\n                                ? Icons.visibility_rounded\n                                : Icons.more_vert_rounded,\n                            color: Colors.white,\n                            size: 24,\n                          ),\n                        ),\n                      ),\n"""
          if old_icon not in f:
              raise SystemExit('Expected top-right menu block not found')
          f = f.replace(old_icon, new_icon, 1)

          # Pass the feed-owned mode through without touching the PageView/gesture detector structure.
          f = f.replace(
              "            isSaved: _savedVideos.contains(video.id),\n            onLike:",
              "            isSaved: _savedVideos.contains(video.id),\n            isSuperViewActive: _isSuperViewActive,\n            onSuperViewToggle: () => setState(() => _isSuperViewActive = false),\n            onLike:",
          )
          # The same replacement occurs for both feed builders.

          if f.count('isSuperViewActive: _isSuperViewActive') != 2:
              raise SystemExit('Super View props were not wired to both feeds')

          v = v.replace(
              "  final bool isSaved;\n  final VoidCallback onFollow;",
              "  final bool isSaved;\n  final bool isSuperViewActive;\n  final VoidCallback onFollow;\n  final VoidCallback? onSuperViewToggle;",
              1,
          )
          v = v.replace(
              "    this.isSaved = false,\n    required this.onFollow,",
              "    this.isSaved = false,\n    this.isSuperViewActive = false,\n    this.onSuperViewToggle,\n    required this.onFollow,",
              1,
          )

          # Fade only the right rail; the existing GestureDetector remains unchanged.
          old_rail = """            if (!_clearDisplay)\n              Positioned(\n                right: 10,\n                bottom: 84 + MediaQuery.of(context).viewPadding.bottom,\n                child: Column(\n"""
          new_rail = """            if (!_clearDisplay)\n              Positioned(\n                right: 10,\n                bottom: 84 + MediaQuery.of(context).viewPadding.bottom,\n                child: IgnorePointer(\n                  ignoring: widget.isSuperViewActive,\n                  child: AnimatedOpacity(\n                    duration: const Duration(milliseconds: 220),\n                    curve: Curves.easeOut,\n                    opacity: widget.isSuperViewActive ? 0.0 : 1.0,\n                    child: Column(\n"""
          if old_rail not in v:
              raise SystemExit('Expected action rail start not found')
          v = v.replace(old_rail, new_rail, 1)
          rail_end = """                  ],\n                ),\n              ),\n\n            // 7. Bottom Metadata\n"""
          rail_end_new = """                    ],\n                  ),\n                ),\n              ),\n\n            // 7. Bottom Metadata\n"""
          if rail_end not in v:
              raise SystemExit('Expected action rail end not found')
          v = v.replace(rail_end, rail_end_new, 1)

          # Preserve Shop + Creator + audio, but fade the expandable caption block only.
          old_caption = """                    const SizedBox(height: 5),\n                    Text(\n                      widget.video.caption,\n                      maxLines: _isCaptionExpanded ? 8 : 2,\n                      overflow: _isCaptionExpanded\n                          ? TextOverflow.visible\n                          : TextOverflow.ellipsis,\n                      style: const TextStyle(\n                        color: Colors.white,\n                        fontSize: 13,\n                        height: 1.3,\n                        fontWeight: FontWeight.w400,\n                      ),\n                    ),\n                    if (widget.video.caption.length > 90)\n                      GestureDetector(\n                        onTap: () => setState(\n                          () => _isCaptionExpanded = !_isCaptionExpanded,\n                        ),\n                        child: Padding(\n                          padding: const EdgeInsets.only(top: 3),\n                          child: Text(\n                            _isCaptionExpanded ? 'See less' : '...See more',\n                            style: const TextStyle(\n                              color: Colors.white70,\n                              fontSize: 11.5,\n                              fontWeight: FontWeight.w700,\n                            ),\n                          ),\n                        ),\n                      ),\n"""
          new_caption = """                    AnimatedOpacity(\n                      duration: const Duration(milliseconds: 220),\n                      curve: Curves.easeOut,\n                      opacity: widget.isSuperViewActive ? 0.0 : 1.0,\n                      child: IgnorePointer(\n                        ignoring: widget.isSuperViewActive,\n                        child: Column(\n                          crossAxisAlignment: CrossAxisAlignment.start,\n                          mainAxisSize: MainAxisSize.min,\n                          children: [\n                            const SizedBox(height: 5),\n                            Text(\n                              widget.video.caption,\n                              maxLines: _isCaptionExpanded ? 8 : 2,\n                              overflow: _isCaptionExpanded\n                                  ? TextOverflow.visible\n                                  : TextOverflow.ellipsis,\n                              style: const TextStyle(\n                                color: Colors.white,\n                                fontSize: 13,\n                                height: 1.3,\n                                fontWeight: FontWeight.w400,\n                              ),\n                            ),\n                            if (widget.video.caption.length > 90)\n                              GestureDetector(\n                                onTap: () => setState(\n                                  () => _isCaptionExpanded = !_isCaptionExpanded,\n                                ),\n                                child: Padding(\n                                  padding: const EdgeInsets.only(top: 3),\n                                  child: Text(\n                                    _isCaptionExpanded ? 'See less' : '...See more',\n                                    style: const TextStyle(\n                                      color: Colors.white70,\n                                      fontSize: 11.5,\n                                      fontWeight: FontWeight.w700,\n                                    ),\n                                  ),\n                                ),\n                              ),\n                          ],\n                        ),\n                      ),\n                    ),\n"""
          if old_caption not in v:
              raise SystemExit('Expected caption block not found')
          v = v.replace(old_caption, new_caption, 1)

          video.write_text(v)
          feed.write_text(f)
          print('Step 7 patch applied')
          PY

          flutter pub get
          flutter analyze lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart

          git status --short
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart .github/workflows/apply-step7.yml
          git commit -m 'feat: add Super View and finalize share sheet wiring'
          git rm .github/workflows/apply-step7.yml
          git commit --amend --no-edit
          git push origin HEAD:main

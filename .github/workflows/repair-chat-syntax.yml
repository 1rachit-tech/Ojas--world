name: Repair Chat Syntax

on:
  push:
    branches: [main]
    paths:
      - 'lib/screens/chat_room_screen.dart'
      - '.github/workflows/repair-chat-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair escaped identifier if present
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'lib/screens/chat_room_screen.dart';
            const result = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            if (Array.isArray(result.data) || !result.data.content) {
              core.setFailed('Unable to read chat source.');
              return;
            }

            const sha = result.data.sha;
            const original = Buffer.from(result.data.content, 'base64').toString('utf8');
            const broken = '...\\_loadedMessages';
            if (!original.includes(broken)) {
              core.info('Chat syntax already clean.');
              return;
            }

            const fixed = original.replaceAll(broken, '..._loadedMessages');
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: 'fix(messages): repair chat identifier syntax',
              sha,
              content: Buffer.from(fixed, 'utf8').toString('base64'),
            });
            core.info('Chat identifier syntax repaired.');

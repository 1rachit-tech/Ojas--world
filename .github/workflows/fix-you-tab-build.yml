name: Fix You tab build

on:
  push:
    paths:
      - .github/workflows/fix-you-tab-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded compile fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/messages_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_line = "import 'package:cloud_firestore/cloud_firestore.dart';\n"
          if import_line not in text:
              anchor = "import 'package:flutter/services.dart';\n"
              if anchor not in text:
                  raise SystemExit('Expected Flutter services import not found; refusing to modify file.')
              text = text.replace(anchor, anchor + import_line, 1)

          old_close = """            },\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _buildEmbeddedHeader() {\n"""
          new_close = """            },\n          ),\n        ),\n        ],\n      ),\n    );\n  }\n\n  Widget _buildEmbeddedHeader() {\n"""
          if old_close not in text:
              raise SystemExit('Expected You-tab Messages wrapper boundary not found; refusing to modify file.')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text, encoding='utf-8')
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q "package:cloud_firestore/cloud_firestore.dart" lib/screens/messages_screen.dart
          python - <<'PY'
          from pathlib import Path
          text = Path('lib/screens/messages_screen.dart').read_text(encoding='utf-8')
          assert "        ),\n        ],\n      )," in text
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-you-tab-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/messages_screen.dart .github/workflows/fix-you-tab-build.yml
          git commit -m "fix: repair You tab messages compilation"
          git push origin HEAD:main

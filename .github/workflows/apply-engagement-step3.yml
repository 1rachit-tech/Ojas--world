import 'package:flutter/material.dart';
import 'package:url_launcher/url_launcher.dart';

import '../models/shop_item_model.dart';

class ReelShopProductsBottomSheet extends StatefulWidget {
  const ReelShopProductsBottomSheet({super.key, required this.shopItemIds});

  final List<String> shopItemIds;

  static Future<void> show(BuildContext context, {required List<String> shopItemIds}) {
    return showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      backgroundColor: Colors.transparent,
      builder: (_) => ReelShopProductsBottomSheet(shopItemIds: shopItemIds),
    );
  }

  @override
  State<ReelShopProductsBottomSheet> createState() => _ReelShopProductsBottomSheetState();
}

class _ReelShopProductsBottomSheetState extends State<ReelShopProductsBottomSheet> {
  List<ShopItemModel> _items = const [];
  bool _loading = true;

  @override
  void initState() {
    super.initState();
    _loadItems();
  }

  Future<void> _loadItems() async {
    final ids = widget.shopItemIds.where((id) => id.trim().isNotEmpty).toList(growable: false);
    if (ids.isEmpty) {
      if (mounted) setState(() => _loading = false);
      return;
    }

    final results = <ShopItemModel>[];
    final collection = FirebaseFirestore.instance.collection('shopItems');

    for (var start = 0; start < ids.length; start += 30) {
      final chunk = ids.skip(start).take(30).toList(growable: false);
      final snapshot = await collection.where(FieldPath.documentId, whereIn: chunk).get();
      results.addAll(
        snapshot.docs
            .map(ShopItemModel.fromFirestore)
            .where((item) => item.active),
      );
    }

    if (!mounted) return;
    setState(() {
      _items = results;
      _loading = false;
    });
  }

  String _formatPrice(ShopItemModel item) {
    final value = item.priceMinor / 100;
    return '${item.currency} ${value.toStringAsFixed(2)}';
  }

  Future<void> _openProduct(ShopItemModel item) async {
    final uri = Uri.tryParse(item.productUrl);
    if (uri == null) return;
    await launchUrl(uri, mode: LaunchMode.externalApplication);
  }

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      top: false,
      child: Container(
        height: MediaQuery.of(context).size.height * 0.72,
        decoration: const BoxDecoration(

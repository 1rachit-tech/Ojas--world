          (root / 'lib/services/engagement_service.dart').write_text(r'''import 'package:cloud_firestore/cloud_firestore.dart';
import 'package:firebase_auth/firebase_auth.dart';

class EngagementService {
  EngagementService({FirebaseFirestore? firestore, FirebaseAuth? auth})
      : _firestore = firestore ?? FirebaseFirestore.instance,
        _auth = auth ?? FirebaseAuth.instance;

  final FirebaseFirestore _firestore;
  final FirebaseAuth _auth;

  Future<void> syncInteraction({
    required String reelId,
    required bool liked,
    required bool saved,
  }) async {
    final uid = _auth.currentUser?.uid;
    if (uid == null || reelId.trim().isEmpty) return;

    final reelRef = _firestore.collection('reels').doc(reelId);
    final interactionRef = _firestore
        .collection('users')
        .doc(uid)
        .collection('interactions')
        .doc(reelId);

    // No read-modify-write. The server atomically applies both deltas.
    final deltaLikes = liked ? 1 : -1;
    final deltaSaves = saved ? 1 : -1;

    final batch = _firestore.batch();
    batch.set(
      interactionRef,
      <String, dynamic>{
        'liked': liked,
        'saved': saved,
        'updatedAt': FieldValue.serverTimestamp(),
      },
      SetOptions(merge: true),
    );
    batch.set(
      reelRef,
      <String, dynamic>{
        'likes': FieldValue.increment(deltaLikes),
        'saves': FieldValue.increment(deltaSaves),
      },
      SetOptions(merge: true),
    );

    try {
      await batch.commit();
    } catch (error) {
      // Engagement is intentionally fire-and-forget from the UI.
      // A later retry path can be added without changing the UI contract.
      // ignore: avoid_print
      print('OJAS engagement sync failed: $error');
    }
  }
}
''', encoding='utf-8')


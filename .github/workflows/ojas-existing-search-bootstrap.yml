name: OJAS Existing Azure Search Bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: azure-search-production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing Azure AI Search service
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ENDPOINT="$(az search service show --resource-group "ojas-search-rg" --name "ojas-search-ebe5f6" --query endpoint --output tsv)"
          test -n "$SEARCH_ENDPOINT"
          echo "Existing Search endpoint: $SEARCH_ENDPOINT"

      - name: Create or update OJAS search index
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ENDPOINT="$(az search service show --resource-group "ojas-search-rg" --name "ojas-search-ebe5f6" --query endpoint --output tsv)"
          SEARCH_TOKEN="$(az account get-access-token --resource https://search.azure.com --query accessToken --output tsv)"
          test -n "$SEARCH_TOKEN"
          curl -fsS -X PUT \
            "${SEARCH_ENDPOINT}/indexes('ojas-search-v1')?api-version=2026-04-01" \
            -H "Authorization: Bearer ${SEARCH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            --data-binary @azure/search-infra/index.schema.json
          echo "OJAS index create/update request succeeded."

      - name: Verify OJAS search index
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_ENDPOINT="$(az search service show --resource-group "ojas-search-rg" --name "ojas-search-ebe5f6" --query endpoint --output tsv)"
          SEARCH_TOKEN="$(az account get-access-token --resource https://search.azure.com --query accessToken --output tsv)"
          curl -fsS \
            "${SEARCH_ENDPOINT}/indexes('ojas-search-v1')?api-version=2026-04-01" \
            -H "Authorization: Bearer ${SEARCH_TOKEN}" \
            -H "Accept: application/json" \
            | tee /tmp/ojas-search-index.json >/dev/null
          python - <<'PY'
import json
from pathlib import Path
p = Path('/tmp/ojas-search-index.json')
data = json.loads(p.read_text())
assert data.get('name') == 'ojas-search-v1', data.get('name')
assert any(f.get('name') == 'id' and f.get('key') is True for f in data.get('fields', []))
print('Verified index name and key field: ojas-search-v1 / id')
PY
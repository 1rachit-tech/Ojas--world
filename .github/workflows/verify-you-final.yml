name: Verify You tab final

on:
  push:
    paths:
      - .github/workflows/verify-you-final.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-you-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/verify-you-final.yml
          git commit -m "chore: remove final build trigger"
          git push origin HEAD:main

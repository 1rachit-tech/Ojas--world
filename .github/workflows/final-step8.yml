name: Finalize Module C Step 8

on:
  push:
    branches: [main]
    paths:
      - '.step8-final-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/step8_finalize.py
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/ojs_feed_screen.dart lib/widgets/ojs_video_page.dart
          git rm scripts/step8_finalize.py .github/workflows/final-step8.yml .step8-final-trigger
          git commit -m 'feat: finalize Module C invisible polish and zero-waste metrics'
          git push origin HEAD:main

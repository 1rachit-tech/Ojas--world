name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-functions-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions-production
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Firebase CLI
        run: npm install -g firebase-tools --no-audit --no-fund

      - name: Configure Azure Search bridge environment
        working-directory: functions
        env:
          AZURE_SEARCH_INGEST_URL: ${{ secrets.AZURE_SEARCH_INGEST_URL }}
          AZURE_SEARCH_INGEST_SECRET: ${{ secrets.AZURE_SEARCH_INGEST_SECRET }}
        run: |
          if [[ -n "$AZURE_SEARCH_INGEST_URL" && -n "$AZURE_SEARCH_INGEST_SECRET" ]]; then
            printf '%s\n' \
              "AZURE_SEARCH_INGEST_URL=$AZURE_SEARCH_INGEST_URL" \
              "AZURE_SEARCH_INGEST_SECRET=$AZURE_SEARCH_INGEST_SECRET" \
              "SEARCH_INDEX_MIRROR_FIRESTORE=false" \
              > .env.ojas-e8161
            echo "Azure Search bridge configuration prepared for Firebase Functions."
          else
            rm -f .env.ojas-e8161
            echo "Azure Search bridge secrets are not configured; Firebase indexing stays on the existing fallback path."
          fi

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project ojas-e8161 --non-interactive

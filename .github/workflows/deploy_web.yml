name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        shell: bash
        run: |
          set -e
          if flutter build web --release --web-renderer html --base-href "/Ojas--world/"; then
            echo "HTML renderer build succeeded."
          else
            echo "HTML renderer build failed; retrying with canvaskit renderer."
            flutter build web --release --web-renderer canvaskit --base-href "/Ojas--world/"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
